name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.p12

      # Fails fast on a corrupt keystore, a wrong store password, or a bad alias, so a
      # signing problem surfaces here with a clear message instead of deep inside Gradle.
      - name: Verify Keystore
        run: keytool -list -keystore release.p12 -storepass hasan3522 -alias rafeeq

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Guards against Android's "Parse error" at install time: confirms the built APK is a
      # well-formed package (a valid zip containing AndroidManifest.xml + classes.dex) and
      # prints a SHA-256 so a truncated download can be ruled out by comparison. Note that
      # upload-artifact delivers the APK wrapped in a zip; the .zip must be extracted before
      # installing, or Android reports "Parse error".
      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest\.xml|classes.*\.dex'
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
