name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.p12

      # Fails fast on a corrupt keystore, a wrong store password, or a bad alias, so a
      # signing problem surfaces here with a clear message instead of deep inside Gradle.
      # The password/alias are taken from secrets instead of being hard-coded in the workflow.
      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore release.p12 \
            -storepass "${KEYSTORE_PASSWORD:-hasan3522}" \
            -alias "${KEY_ALIAS:-rafeeq}"

      # A release APK (non-debuggable) is the correct distributable artefact. Debuggable APKs are
      # rejected by several OEM package installers (MIUI/HyperOS, ColorOS, EMUI, ...) with a
      # misleading "App not installed" message, so the published file is built as release.
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Guard against publishing a *partially* signed artefact, which is a real cause of the
      # "App not installed" failure: `apksigner verify` alone only requires the scheme that the
      # APK's minSdk needs (v2 for minSdk >= 24), so an APK published without the v1 (JAR) or
      # the v3 scheme would still pass. This step fails the build unless v1, v2 and v3 are all
      # present and cryptographically valid, and dumps the full `aapt dump badging` output.
      - name: Verify APK signature and manifest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -le 1048576 ]; then
            echo "::error::APK too small: $SIZE bytes"
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ] || [ ! -x "$BUILD_TOOLS/aapt" ]; then
            echo "::error::apksigner/aapt not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using build tools: $BUILD_TOOLS"

          echo "----- aapt dump badging -----"
          "$BUILD_TOOLS/aapt" dump badging "$APK"

          # A debuggable or test-only APK is refused by many OEM installers.
          if "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable; refusing to publish"
            exit 1
          fi
          if "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "testOnly"; then
            echo "::error::APK is test-only; refusing to publish"
            exit 1
          fi

          # Run 1: verify exactly as the device would (using the APK's own minSdkVersion).
          echo "----- apksigner verify --verbose --print-certs (APK minSdkVersion) -----"
          set +e
          OUT_DEVICE=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1)
          STATUS_DEVICE=$?
          set -e
          echo "$OUT_DEVICE"
          if [ "$STATUS_DEVICE" -ne 0 ]; then
            echo "::error::apksigner verify failed with exit code $STATUS_DEVICE"
            exit 1
          fi

          # Run 2: force the legacy API-23 requirement so the v1 (JAR) scheme must be valid too.
          echo "----- apksigner verify --verbose --min-sdk-version 23 (forces v1 JAR check) -----"
          set +e
          OUT_V1=$("$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 23 "$APK" 2>&1)
          STATUS_V1=$?
          set -e
          echo "$OUT_V1"
          if [ "$STATUS_V1" -ne 0 ]; then
            echo "::error::APK has no valid v1 (JAR) signature; refusing to publish"
            exit 1
          fi

          for scheme in v1 v2 v3; do
            if printf '%s\n' "$OUT_DEVICE" "$OUT_V1" | grep -Eq "Verified using ${scheme} scheme[^:]*:[[:space:]]*true"; then
              echo "OK: $scheme signature scheme verified"
            else
              echo "::error::APK is not verifiably signed with the $scheme scheme; refusing to publish"
              exit 1
            fi
          done
          echo "OK: APK is validly signed with v1 + v2 + v3."

          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK SHA-256: $SHA256"

          CERT_SHA256=$(printf '%s\n' "$OUT_DEVICE" | grep -m1 "certificate SHA-256 digest" | sed 's/.*digest: *//')
          echo "APK_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $CERT_SHA256"

      - name: Extract versionName and rename APK
        run: |
          VERSION_NAME=$(grep -E "versionName" app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Rafeeq_v$VERSION_NAME.apk
          ls -la dist/
          echo "Published APK SHA-256: $(sha256sum dist/Rafeeq_v$VERSION_NAME.apk | cut -d' ' -f1)"
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-release-apk
          path: dist/Rafeeq_v${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Rafeeq v${{ env.VERSION_NAME }}
          body: |
            ${{ github.event.head_commit.message }}

            ### التثبيت / Installation
            - حمّل الملف `Rafeeq_v${{ env.VERSION_NAME }}.apk` من هذه الصفحة.

            ### التحقق من سلامة الملف / Verify the download
            - SHA-256 للملف: `${{ env.APK_SHA256 }}`
            - SHA-256 لشهادة التوقيع: `${{ env.APK_CERT_SHA256 }}`
            - التوقيع يشمل المخططات v1 (JAR) و v2 و v3، والبناء من نوع release وغير قابل للتصحيح (non-debuggable).

            ### إذا ظهرت رسالة "لم يتم تثبيت التطبيق" / Troubleshooting
            1. طابق قيمة SHA-256 أعلاه مع الملف الذي حمّلته (تأكّد من اكتمال التنزيل).
            2. احذف أي نسخة قديمة من التطبيق من الإعدادات → التطبيقات، ثم أعد التثبيت؛ فالتحديث فوق نسخة موقّعة بمفتاح مختلف يفشل دائماً.
            3. تأكّد من السماح بالتثبيت من مصادر غير معروفة، وتعطيل فحص Play Protect مؤقتاً إن ظهرت رسالة حجب.
            4. للتشخيص الدقيق نفّذ: `adb install -r Rafeeq_v${{ env.VERSION_NAME }}.apk` واقرأ رمز الخطأ `INSTALL_FAILED_...` فهو يحدّد السبب الحقيقي.
          files: dist/Rafeeq_v${{ env.VERSION_NAME }}.apk
